name: ChainSeed CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seedemu-ref:
        description: "SeedEmu revision from seed-labs/seed-emulator"
        type: string
        required: true
        default: Docker
      selected-example:
        description: "Run one selected example, or all"
        type: choice
        required: true
        default: all
        options:
          - all
          - E01
          - E02
          - E03
          - E04
          - E05
          - E06
          - E07
      run-full-lifecycle:
        description: "Run Docker build/up/probe/test/down lifecycle"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SEEDEMU_REF: ${{ github.event.inputs['seedemu-ref'] || 'Docker' }}
  SELECTED_EXAMPLE: ${{ github.event.inputs['selected-example'] || 'all' }}
  RUN_FULL_LIFECYCLE: ${{ github.event.inputs['run-full-lifecycle'] || 'false' }}

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chain-seed
    steps:
      - name: Check out ChainSeed
        uses: actions/checkout@v5
        with:
          path: chain-seed

      - name: Check out SeedEmu
        uses: actions/checkout@v5
        with:
          repository: seed-labs/seed-emulator
          ref: ${{ env.SEEDEMU_REF }}
          path: seed-emulator

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            seed-emulator/**/*requirements.txt
            chain-seed/pyproject.toml

      - name: Build ChainSEED wheel
        run: |
          pip install build
          python -m build --wheel . --outdir ../wheels

      - name: Check installed ChainSEED wheel and copied examples
        run: |
          pip install -e ../seed-emulator
          pip install ../wheels/chainseed-*.whl
          pip check
          python -I tests/installed_package_smoke.py --examples examples

      - name: Install coordinated workspaces
        run: |
          pip install -e ../seed-emulator
          pip install ".[dev]"

      - name: Check repository ownership
        run: python tests/check_repository_boundaries.py --seedemu ../seed-emulator

      - name: Compile ChainSeed packages and example tests
        run: python -m compileall -q chainseed examples case_study

      - name: Check public imports
        run: python -m pytest -q tests/test_public_imports.py tests/test_package_integration.py tests/test_example_network.py tests/test_runner_commands.py tests/test_ethereum_runtime_config.py tests/test_ethereum_static_peers.py tests/test_lookingglass_server.py tests/test_e03_lookingglass.py tests/test_case_studies.py

      - name: Validate example manifests
        run: |
          chainseed-test clean examples/ethereum/E01_ethereum_pos/example.yaml
          chainseed-test clean examples/ethereum/E02_eth_explorer/example.yaml
          chainseed-test clean examples/ethereum/E03_lookingglass/example.yaml
          chainseed-test clean examples/ethereum/E04_faucet/example.yaml
          chainseed-test clean examples/ethereum/E05_deploy_contract/example.yaml
          chainseed-test clean examples/ethereum/E06_oracle/example.yaml
          chainseed-test clean examples/ethereum/E07_validator/example.yaml

  compile-selected-examples:
    name: Compile ${{ matrix.example.code }}
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chain-seed
    strategy:
      fail-fast: false
      matrix:
        example:
          - code: E01
            manifest: examples/ethereum/E01_ethereum_pos/example.yaml
          - code: E02
            manifest: examples/ethereum/E02_eth_explorer/example.yaml
          - code: E03
            manifest: examples/ethereum/E03_lookingglass/example.yaml
          - code: E04
            manifest: examples/ethereum/E04_faucet/example.yaml
          - code: E05
            manifest: examples/ethereum/E05_deploy_contract/example.yaml
          - code: E06
            manifest: examples/ethereum/E06_oracle/example.yaml
          - code: E07
            manifest: examples/ethereum/E07_validator/example.yaml
    steps:
      - name: Check out ChainSeed
        uses: actions/checkout@v5
        with:
          path: chain-seed

      - name: Check out SeedEmu
        uses: actions/checkout@v5
        with:
          repository: seed-labs/seed-emulator
          ref: ${{ env.SEEDEMU_REF }}
          path: seed-emulator

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            seed-emulator/**/*requirements.txt
            chain-seed/pyproject.toml

      - name: Install coordinated workspaces
        run: |
          pip install -e ../seed-emulator
          pip install ".[dev]"

      - name: Compile selected example
        if: ${{ env.SELECTED_EXAMPLE == 'all' || env.SELECTED_EXAMPLE == matrix.example.code }}
        run: |
          chainseed-test compile \
            ${{ matrix.example.manifest }} \
            --artifact-dir ci-artifacts/${{ matrix.example.code }}-compile

      - name: Upload compile artifacts
        if: ${{ always() && (env.SELECTED_EXAMPLE == 'all' || env.SELECTED_EXAMPLE == matrix.example.code) }}
        uses: actions/upload-artifact@v6
        with:
          name: chainseed-${{ matrix.example.code }}-compile-artifacts
          path: chain-seed/ci-artifacts/${{ matrix.example.code }}-compile

  run-selected-examples:
    name: Run ${{ matrix.example.code }}
    needs: compile-selected-examples
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chain-seed
    strategy:
      fail-fast: false
      matrix:
        example:
          - code: E01
            manifest: examples/ethereum/E01_ethereum_pos/example.yaml
          - code: E02
            manifest: examples/ethereum/E02_eth_explorer/example.yaml
          - code: E03
            manifest: examples/ethereum/E03_lookingglass/example.yaml
          - code: E04
            manifest: examples/ethereum/E04_faucet/example.yaml
          - code: E05
            manifest: examples/ethereum/E05_deploy_contract/example.yaml
          - code: E06
            manifest: examples/ethereum/E06_oracle/example.yaml
          - code: E07
            manifest: examples/ethereum/E07_validator/example.yaml
    steps:
      - name: Check out ChainSeed
        uses: actions/checkout@v5
        with:
          path: chain-seed

      - name: Check out SeedEmu
        uses: actions/checkout@v5
        with:
          repository: seed-labs/seed-emulator
          ref: ${{ env.SEEDEMU_REF }}
          path: seed-emulator

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            seed-emulator/**/*requirements.txt
            chain-seed/pyproject.toml

      - name: Install coordinated workspaces
        run: |
          pip install -e ../seed-emulator
          pip install ".[dev]"

      - name: Run selected example lifecycle
        if: ${{ env.RUN_FULL_LIFECYCLE == 'true' && (env.SELECTED_EXAMPLE == 'all' || env.SELECTED_EXAMPLE == matrix.example.code) }}
        run: |
          chainseed-test all \
            ${{ matrix.example.manifest }} \
            --artifact-dir ci-artifacts/${{ matrix.example.code }}

      - name: Upload lifecycle artifacts
        if: ${{ always() && env.RUN_FULL_LIFECYCLE == 'true' && (env.SELECTED_EXAMPLE == 'all' || env.SELECTED_EXAMPLE == matrix.example.code) }}
        uses: actions/upload-artifact@v6
        with:
          name: chainseed-${{ matrix.example.code }}-lifecycle-artifacts
          path: chain-seed/ci-artifacts/${{ matrix.example.code }}

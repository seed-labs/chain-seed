[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainseed"
version = "0.1.0a0"
description = "Blockchain protocol extensions, images, tools, and experiments for SeedEmu"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE.txt"}
authors = [
  {name = "SEED Labs"}
]
dependencies = [
  "PyYAML>=6.0,<7",
  "seedemu>=0.0.7,<0.1",
  "eth-account==0.5.9",
  "eth-keys>=0.3.4,<0.4",
  "requests>=2.22",
  "web3==5.31.1",
  "setuptools<81",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "tomli>=2,<3",
]

[project.entry-points."seedemu.extensions"]
chainseed = "chainseed.extension:descriptor"

[project.scripts]
chainseed-test = "chainseed.testing.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["chainseed*"]

[tool.setuptools.package-data]
"chainseed.services.ethereum.LookingglassServer" = ["static/*"]
"chainseed.services.ethereum.EthTemplates" = [
  "files_ethereum/*",
  "files_faucet/*",
  "files_utility/*",
]
"chainseed.services.chainlink.ChainlinkTemplates" = [
  "contracts/*",
  "contracts/fig/*",
  "files/*",
  "files/contract/*",
  "files_user/*",
  "jobs/*",
  "library/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

